---
# Kubespray binds controller-manager, scheduler and kube-proxy metrics to
# 127.0.0.1 and etcd metrics need client certs: scraping them only yields
# permanent TargetDown alerts.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

alertmanager:
  alertmanagerSpec:
    # Mounted at /etc/alertmanager/secrets/<secret>/<key>
    secrets:
      - alertmanager-secrets
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: telegram
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Watchdog, InfoInhibitor and info-level noise.
        - receiver: "null"
          matchers:
            - severity =~ "none|info"
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: [alertname, namespace]
    receivers:
      - name: "null"
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-secrets/telegram-bot-token
            chat_id: 8336629237
            parse_mode: HTML
            message: '{{ template "telegram.homelab" . }}'
            send_resolved: true
    templates:
      - /etc/alertmanager/config/*.tmpl
  templateFiles:
    telegram.tmpl: |-
      {{/* One alert: summary, description, where, when. Values are HTML-escaped for Telegram. */}}
      {{ define "telegram.homelab.alert" }}
      {{- if .Annotations.summary }}<b>{{ .Annotations.summary | html }}</b>{{ else }}<b>{{ .Labels.alertname | html }}</b>{{ end }}
      {{- with .Annotations.description }}
      {{ . | html }}{{ end }}
      {{- with .Labels.namespace }}
      📦 <code>{{ . | html }}</code>{{ end }}
      {{- with (or .Labels.pod .Labels.persistentvolumeclaim .Labels.name .Labels.node .Labels.instance) }}
      🎯 <code>{{ . | html }}</code>{{ end }}
      🕒 {{ (.StartsAt | tz "Europe/Paris").Format "02/01 15:04" }}
      {{- if eq .Status "resolved" }} → {{ (.EndsAt | tz "Europe/Paris").Format "15:04" }} ({{ reReplaceAll "([hm])0s$" "$1" (printf "%s" ((.EndsAt.Sub .StartsAt).Round 60000000000)) }}){{ end }}
      {{- end }}

      {{ define "telegram.homelab.severity" }}
      {{- if eq . "critical" }}🔴{{ else if eq . "warning" }}🟠{{ else }}🔵{{ end }}
      {{- end }}

      {{ define "telegram.homelab" }}
      {{- if .Alerts.Firing }}
      {{- template "telegram.homelab.severity" .CommonLabels.severity }} <b>{{ .CommonLabels.alertname | html }}</b>
      {{- if gt (len .Alerts.Firing) 1 }} ×{{ len .Alerts.Firing }}{{ end }}
      {{- with .CommonLabels.severity }} · <i>{{ . | html }}</i>{{ end }}
      {{ range $i, $a := .Alerts.Firing }}{{ if lt $i 10 }}
      {{ template "telegram.homelab.alert" $a }}
      {{ end }}{{ end }}
      {{- if gt (len .Alerts.Firing) 10 }}<i>… showing the first 10 alerts only</i>
      {{ end }}
      {{- end }}
      {{- if .Alerts.Resolved }}
      {{- if .Alerts.Firing }}
      {{ end }}✅ <b>Resolved · {{ .CommonLabels.alertname | html }}</b>
      {{- if gt (len .Alerts.Resolved) 1 }} ×{{ len .Alerts.Resolved }}{{ end }}
      {{ range $i, $a := .Alerts.Resolved }}{{ if lt $i 10 }}
      {{ template "telegram.homelab.alert" $a }}
      {{ end }}{{ end }}
      {{- end }}
      {{- end }}

# Webhook certs from cert-manager instead of the certgen hook Jobs, whose
# hook-succeeded + ttlSecondsAfterFinished policies leave ArgoCD syncs hanging.
prometheusOperator:
  admissionWebhooks:
    certManager:
      enabled: true

prometheus:
  prometheusSpec:
    retention: 3d
    retentionSize: 9GB
    # Pick up ServiceMonitors/PodMonitors/rules from every release, not only this one.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests:
        memory: 512Mi
      limits:
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-single
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

grafana:
  admin:
    existingSecret: grafana-secrets
    userKey: admin-user
    passwordKey: admin-password
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-secrets
        key: oidc-client-secret
  grafana.ini:
    server:
      root_url: https://grafana.beutra.fr
    auth:
      signout_redirect_url: https://auth.beutra.fr/application/o/grafana/end-session/
    auth.generic_oauth:
      enabled: true
      name: Authentik
      client_id: grafana
      scopes: openid profile email groups
      auth_url: https://auth.beutra.fr/application/o/authorize/
      token_url: https://auth.beutra.fr/application/o/token/
      api_url: https://auth.beutra.fr/application/o/userinfo/
      login_attribute_path: preferred_username
      # Same groups as ArgoCD RBAC.
      role_attribute_path: "contains(groups, 'admin') && 'Admin' || contains(groups, 'dev') && 'Editor' || 'Viewer'"
      allow_sign_up: true
      use_pkce: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: homelab
          orgId: 1
          folder: Homelab
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/homelab
  # Downloaded from grafana.com at pod start. Cluster/node dashboards ship with the chart.
  dashboards:
    homelab:
      traefik:
        gnetId: 17347
        revision: 9
        datasource: [{name: DS_PROMETHEUS, value: prometheus}]
      longhorn:
        gnetId: 13032
        revision: 6
        datasource: [{name: DS_PROMETHEUS, value: prometheus}]
      argocd:
        gnetId: 14584
        revision: 1
      cert-manager:
        gnetId: 20842
        revision: 3
      cloudnative-pg:
        gnetId: 20417
        revision: 4
        datasource: [{name: DS_PROMETHEUS, value: prometheus}, {name: DS_EXPRESSION, value: __expr__}]
  persistence:
    enabled: true
    storageClassName: longhorn-single
    size: 2Gi
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - grafana.beutra.fr
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.beutra.fr
