---
# Kubespray binds controller-manager, scheduler and kube-proxy metrics to
# 127.0.0.1 and etcd metrics need client certs: scraping them only yields
# permanent TargetDown alerts.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

# No receiver configured yet.
alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 3d
    retentionSize: 9GB
    # Pick up ServiceMonitors/PodMonitors/rules from every release, not only this one.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests:
        memory: 512Mi
      limits:
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-single
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

grafana:
  admin:
    existingSecret: grafana-secrets
    userKey: admin-user
    passwordKey: admin-password
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-secrets
        key: oidc-client-secret
  grafana.ini:
    server:
      root_url: https://grafana.beutra.fr
    auth:
      signout_redirect_url: https://auth.beutra.fr/application/o/grafana/end-session/
    auth.generic_oauth:
      enabled: true
      name: Authentik
      client_id: grafana
      scopes: openid profile email groups
      auth_url: https://auth.beutra.fr/application/o/authorize/
      token_url: https://auth.beutra.fr/application/o/token/
      api_url: https://auth.beutra.fr/application/o/userinfo/
      login_attribute_path: preferred_username
      # Same groups as ArgoCD RBAC.
      role_attribute_path: "contains(groups, 'admin') && 'Admin' || contains(groups, 'dev') && 'Editor' || 'Viewer'"
      allow_sign_up: true
      use_pkce: true
  persistence:
    enabled: true
    storageClassName: longhorn-single
    size: 2Gi
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - grafana.beutra.fr
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.beutra.fr
