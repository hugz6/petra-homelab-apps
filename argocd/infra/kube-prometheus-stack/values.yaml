---
# Kubespray binds controller-manager, scheduler and kube-proxy metrics to
# 127.0.0.1 and etcd metrics need client certs: scraping them only yields
# permanent TargetDown alerts.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

alertmanager:
  alertmanagerSpec:
    # Mounted at /etc/alertmanager/secrets/<secret>/<key>
    secrets:
      - alertmanager-secrets
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: telegram
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Watchdog, InfoInhibitor and info-level noise.
        - receiver: "null"
          matchers:
            - severity =~ "none|info"
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: [alertname, namespace]
    receivers:
      - name: "null"
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-secrets/telegram-bot-token
            chat_id: 8336629237
            send_resolved: true
    templates:
      - /etc/alertmanager/config/*.tmpl

prometheus:
  prometheusSpec:
    retention: 3d
    retentionSize: 9GB
    # Pick up ServiceMonitors/PodMonitors/rules from every release, not only this one.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests:
        memory: 512Mi
      limits:
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-single
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

grafana:
  admin:
    existingSecret: grafana-secrets
    userKey: admin-user
    passwordKey: admin-password
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-secrets
        key: oidc-client-secret
  grafana.ini:
    server:
      root_url: https://grafana.beutra.fr
    auth:
      signout_redirect_url: https://auth.beutra.fr/application/o/grafana/end-session/
    auth.generic_oauth:
      enabled: true
      name: Authentik
      client_id: grafana
      scopes: openid profile email groups
      auth_url: https://auth.beutra.fr/application/o/authorize/
      token_url: https://auth.beutra.fr/application/o/token/
      api_url: https://auth.beutra.fr/application/o/userinfo/
      login_attribute_path: preferred_username
      # Same groups as ArgoCD RBAC.
      role_attribute_path: "contains(groups, 'admin') && 'Admin' || contains(groups, 'dev') && 'Editor' || 'Viewer'"
      allow_sign_up: true
      use_pkce: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: homelab
          orgId: 1
          folder: Homelab
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/homelab
  # Downloaded from grafana.com at pod start. Cluster/node dashboards ship with the chart.
  dashboards:
    homelab:
      traefik:
        gnetId: 17347
        revision: 9
        datasource: [{name: DS_PROMETHEUS, value: prometheus}]
      longhorn:
        gnetId: 13032
        revision: 6
        datasource: [{name: DS_PROMETHEUS, value: prometheus}]
      argocd:
        gnetId: 14584
        revision: 1
      cert-manager:
        gnetId: 20842
        revision: 3
      cloudnative-pg:
        gnetId: 20417
        revision: 4
        datasource: [{name: DS_PROMETHEUS, value: prometheus}, {name: DS_EXPRESSION, value: __expr__}]
  persistence:
    enabled: true
    storageClassName: longhorn-single
    size: 2Gi
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - grafana.beutra.fr
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.beutra.fr
