# The sealed-secrets app has no ServiceMonitor; scrape its metrics service from here.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sealed-secrets
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - sealed-secrets
  selector:
    matchLabels:
      app.kubernetes.io/name: sealed-secrets
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
