version: 1
metadata:
  name: "outposts"
entries:
  - model: authentik_outposts.outpost
    state: present
    identifiers:
      name: "homelab-outpost"
    attrs:
      name: "homelab-outpost"
      type: "proxy"
      service_connection: null
      # Every homelab proxy provider can be listed here.
      # Each reference must match a provider that actually exists:
      # an unresolved !Find returns null and empties the whole list.
      providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, "Garlicdoor Proxy Provider"]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, "Longhorn Proxy Provider"]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, "Hermes Proxy Provider"]]
      config:
        authentik_host: "https://auth.beutra.fr"
        authentik_host_insecure: false
        kubernetes_namespace: "authentik"
        kubernetes_ingress_class_name: "traefik"
        kubernetes_replicas: 1
