version: 1
metadata:
  name: "applications"
entries:
  # 'groups' scope mapping
  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      scope_name: groups
    attrs:
      name: "authentik default OAuth Mapping: OpenID 'groups'"
      scope_name: groups
      description: "Group membership"
      expression: |
        return {
            "groups": [group.name for group in request.user.groups.all()],
        }

  # OIDC (OAuth2) provider for ArgoCD
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: "ArgoCD Provider"
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_id: "argocd"
      client_secret: !Env ARGOCD_CLIENT_SECRET
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - url: "https://argocd.infra.beutra.fr/auth/callback"
          matching_mode: "strict"
      sub_mode: "hashed_user_id"
      issuer_mode: "per_provider"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]

  # ArgoCD application
  - model: authentik_core.application
    state: present
    identifiers:
      slug: "argocd"
    attrs:
      name: "ArgoCD"
      slug: "argocd"
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "ArgoCD Provider"]]
      group: "Infrastructure"

  # OIDC (OAuth2) provider for Grafana
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: "Grafana Provider"
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_id: "grafana"
      client_secret: !Env GRAFANA_CLIENT_SECRET
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - url: "https://grafana.beutra.fr/login/generic_oauth"
          matching_mode: "strict"
      sub_mode: "hashed_user_id"
      issuer_mode: "per_provider"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]

  # Grafana application
  - model: authentik_core.application
    state: present
    identifiers:
      slug: "grafana"
    attrs:
      name: "Grafana"
      slug: "grafana"
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "Grafana Provider"]]
      group: "Infrastructure"

  # Proxy provider (forward auth) for Garlicdoor
  - model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: "Garlicdoor Proxy Provider"
    attrs:
      name: "Garlicdoor Proxy Provider"
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: "https://home.beutra.fr"
      mode: "forward_single"

  # Garlicdoor application
  - model: authentik_core.application
    state: present
    identifiers:
      slug: "garlicdoor"
    attrs:
      name: "Garlicdoor"
      slug: "garlicdoor"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Garlicdoor Proxy Provider"]]
      group: "Applications"

  # Proxy provider (forward auth) for Longhorn
  - model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: "Longhorn Proxy Provider"
    attrs:
      name: "Longhorn Proxy Provider"
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: "https://longhorn.infra.beutra.fr"
      mode: "forward_single"

  # Longhorn application
  - model: authentik_core.application
    state: present
    identifiers:
      slug: "longhorn"
    attrs:
      name: "Longhorn"
      slug: "longhorn"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Longhorn Proxy Provider"]]
      group: "Infrastructure"

  # Longhorn UI can delete volumes: admins only
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !Find [authentik_core.application, [slug, "longhorn"]]
      group: !Find [authentik_core.group, [name, "admin"]]
    attrs:
      order: 0

  # OIDC (OAuth2) provider for GitLab
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: "GitLab Provider"
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_id: "gitlab"
      client_secret: !Env GITLAB_CLIENT_SECRET
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - url: "https://gitlab.beutra.fr/users/auth/openid_connect/callback"
          matching_mode: "strict"
      sub_mode: "hashed_user_id"
      issuer_mode: "per_provider"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]

  # GitLab application
  - model: authentik_core.application
    state: present
    identifiers:
      slug: "gitlab"
    attrs:
      name: "GitLab"
      slug: "gitlab"
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "GitLab Provider"]]
      group: "Infrastructure"

  # Proxy provider (forward auth) for the Hermes Agent dashboard
  - model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: "Hermes Proxy Provider"
    attrs:
      name: "Hermes Proxy Provider"
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: "https://dashboard.hermes.beutra.fr"
      mode: "forward_single"
      # The dashboard has its own basic auth, so the browser sends an
      # Authorization header the outpost would otherwise try to validate
      # itself, ignoring the session cookie and redirecting every request.
      intercept_header_auth: false

  # Hermes application
  - model: authentik_core.application
    state: present
    identifiers:
      slug: "hermes"
    attrs:
      name: "Hermes"
      slug: "hermes"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Hermes Proxy Provider"]]
      group: "Applications"

  # The dashboard exposes provider API keys and a shell-capable agent: admins only
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !Find [authentik_core.application, [slug, "hermes"]]
      group: !Find [authentik_core.group, [name, "admin"]]
    attrs:
      order: 0
