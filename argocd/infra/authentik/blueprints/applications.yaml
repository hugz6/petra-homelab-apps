version: 1
metadata:
  name: "applications"
entries:
  # Mappage de scope 'groups'
  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      scope_name: groups
    attrs:
      name: "authentik default OAuth Mapping: OpenID 'groups'"
      scope_name: groups
      description: "Group membership"
      expression: |
        return {
            "groups": [group.name for group in request.user.groups.all()],
        }

  # Provider OIDC (OAuth2) pour ArgoCD
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: "ArgoCD Provider"
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_id: "argocd"
      client_secret: !Env ARGOCD_CLIENT_SECRET
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - url: "https://argocd.infra.beutra.fr/auth/callback"
          matching_mode: "strict"
      sub_mode: "hashed_user_id"
      issuer_mode: "per_provider"
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]

  # Application ArgoCD
  - model: authentik_core.application
    state: present
    identifiers:
      slug: "argocd"
    attrs:
      name: "ArgoCD"
      slug: "argocd"
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "ArgoCD Provider"]]
      group: "Infrastructure"

  # Proxy Provider (forward auth) pour Garlicdoor
  - model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: "Garlicdoor Proxy Provider"
    attrs:
      name: "Garlicdoor Proxy Provider"
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      external_host: "https://home.beutra.fr"
      mode: "forward_single"

  # Application Garlicdoor
  - model: authentik_core.application
    state: present
    identifiers:
      slug: "garlicdoor"
    attrs:
      name: "Garlicdoor"
      slug: "garlicdoor"
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, "Garlicdoor Proxy Provider"]]
      group: "Applications"
