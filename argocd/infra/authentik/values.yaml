---
# -- List of config maps to mount blueprints from.
# The Helm chart automatically mounts these to /blueprints/mounted/
# Authentik discovers and applies all .yaml files in /blueprints/
blueprints:
  enabled: true
  use_default: true
  configMaps:
    - authentik-blueprints-groups
    - authentik-blueprints-users
    - authentik-blueprints-apps
    - authentik-blueprints-outposts

authentik:
  host: https://auth.beutra.fr
  log_level: info

serviceAccount:
  create: true
  fullnameOverride: "authentik"

server:
  serviceAccountName: "authentik"
  resources:
    requests:
      memory: 300Mi
    limits:
      memory: 600Mi
  envFrom:
    - secretRef:
        name: authentik-secrets
    - secretRef:
        name: authentik-oidc-argocd
  env:
    - name: AUTHENTIK_POSTGRESQL__HOST
      valueFrom:
        secretKeyRef:
          name: authentik-pg-app
          key: host
    - name: AUTHENTIK_POSTGRESQL__NAME
      valueFrom:
        secretKeyRef:
          name: authentik-pg-app
          key: dbname
    - name: AUTHENTIK_POSTGRESQL__USER
      valueFrom:
        secretKeyRef:
          name: authentik-pg-app
          key: username
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-pg-app
          key: password
    - name: AUTHENTIK_POSTGRESQL__PORT
      valueFrom:
        secretKeyRef:
          name: authentik-pg-app
          key: port
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - auth.beutra.fr
    tls:
      - secretName: authentik-tls
        hosts:
          - auth.beutra.fr

worker:
  serviceAccountName: "authentik"
  resources:
    requests:
      memory: 400Mi
    limits:
      memory: 1Gi
  envFrom:
    - secretRef:
        name: authentik-secrets
    - secretRef:
        name: authentik-oidc-argocd
  env:
    - name: AUTHENTIK_POSTGRESQL__HOST
      valueFrom:
        secretKeyRef:
          name: authentik-pg-app
          key: host
    - name: AUTHENTIK_POSTGRESQL__NAME
      valueFrom:
        secretKeyRef:
          name: authentik-pg-app
          key: dbname
    - name: AUTHENTIK_POSTGRESQL__USER
      valueFrom:
        secretKeyRef:
          name: authentik-pg-app
          key: username
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-pg-app
          key: password
    - name: AUTHENTIK_POSTGRESQL__PORT
      valueFrom:
        secretKeyRef:
          name: authentik-pg-app
          key: port

postgresql:
  enabled: false
