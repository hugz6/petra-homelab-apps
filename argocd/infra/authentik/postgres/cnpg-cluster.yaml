apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-pg
  namespace: authentik
spec:
  instances: 3
  bootstrap:
    initdb:
      database: authentik
      owner: authentik

  postgresql:
    parameters:
      # A lost replica's slot otherwise retains WAL until the disk fills and
      # every instance refuses to start; past this cap the replica re-clones.
      max_slot_wal_keep_size: "2GB"

  storage:
    size: 10Gi
    storageClass: longhorn-single
