# Manual PodMonitor: Cluster.spec.monitoring.enablePodMonitor is deprecated in CNPG 1.28.
# Name must differ from the Cluster: CNPG deletes a PodMonitor named after it
# while enablePodMonitor is off.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: authentik-pg-metrics
  namespace: authentik
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: authentik-pg
  podMetricsEndpoints:
    - port: metrics
