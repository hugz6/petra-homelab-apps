# Manual PodMonitor: Cluster.spec.monitoring.enablePodMonitor is deprecated in CNPG 1.28.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: authentik-pg
  namespace: authentik
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: authentik-pg
  podMetricsEndpoints:
    - port: metrics
