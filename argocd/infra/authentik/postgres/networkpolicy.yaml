# Isolates the Authentik CNPG Postgres cluster (authentik-pg).
# Once a pod is selected by an ingress NetworkPolicy, all non-matching ingress is
# denied. Legitimate sources to Postgres are:
#   - pods in the authentik namespace (authentik server/worker + streaming replicas)
#   - the CloudNativePG operator in cnpg-system (management + status/health probes)
# Ports: 5432 (postgres + replication), 8000 (CNPG instance manager status/health).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-pg-isolation
  namespace: authentik
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: authentik-pg
  policyTypes:
    - Ingress
  ingress:
    - from:
        # All pods within the authentik namespace (app pods + Postgres replicas).
        - podSelector: {}
        # CloudNativePG operator.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
