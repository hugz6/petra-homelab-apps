---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-keycloak-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: keycloak-store
    kind: SecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: oidc.keycloak.clientSecret
      remoteRef:
        key: argocd-keycloak-secret
        property: clientSecret