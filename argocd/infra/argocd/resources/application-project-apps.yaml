apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Project for apps components
  sourceRepos:
    - 'https://github.com/hugz6/petra-homelab-apps.git'
  destinations:
    # argocd: app-of-apps + Application CRs. garlicdoor: the app itself.
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: garlicdoor
      server: https://kubernetes.default.svc
  # Apps may only create their own namespace at the cluster scope. This blocks
  # ClusterRole/ClusterRoleBinding/CRD creation, preventing cluster-admin escalation.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  # Namespaced resources remain open within the destination namespaces above.
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
