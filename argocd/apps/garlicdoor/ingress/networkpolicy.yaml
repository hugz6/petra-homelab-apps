# Default-deny ingress for the garlicdoor namespace, then allow only Traefik to
# reach the garlicdoor pods on the HTTP port. garlicdoor is a stateless dashboard
# whose only legitimate ingress is the Traefik ingress controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: garlicdoor
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-garlicdoor
  namespace: garlicdoor
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 80
