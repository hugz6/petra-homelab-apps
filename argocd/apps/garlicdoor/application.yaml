apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garlicdoor
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/hugz6/petra-homelab-apps.git
      path: helm-charts/garlicdoor
      targetRevision: main
      helm:
        releaseName: garlicdoor
        valueFiles:
          - $values/argocd/apps/garlicdoor/values.yaml
    - repoURL: https://github.com/hugz6/petra-homelab-apps.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/hugz6/petra-homelab-apps.git
      targetRevision: main
      path: argocd/apps/garlicdoor/ingress

  destination:
    server: https://kubernetes.default.svc
    namespace: garlicdoor

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
