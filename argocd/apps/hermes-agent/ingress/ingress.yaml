---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forwardauth
  namespace: hermes-agent
spec:
  forwardAuth:
    address: http://ak-outpost-homelab-outpost.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - Set-Cookie
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-agent-ingress
  namespace: hermes-agent
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.middlewares: "hermes-agent-authentik-forwardauth@kubernetescrd"
spec:
  ingressClassName: traefik

  tls:
  - hosts:
    - dashboard.hermes.beutra.fr
    secretName: hermes-agent-tls

  rules:
  - host: dashboard.hermes.beutra.fr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hermes-agent
            port:
              number: 9119
