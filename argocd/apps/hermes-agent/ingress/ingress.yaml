---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forwardauth
  namespace: hermes-agent
spec:
  forwardAuth:
    address: http://ak-outpost-homelab-outpost.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - Set-Cookie
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-agent-ingress
  namespace: hermes-agent
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.middlewares: "hermes-agent-authentik-forwardauth@kubernetescrd"
spec:
  ingressClassName: traefik

  tls:
  - hosts:
    - dashboard.hermes.beutra.fr
    secretName: hermes-agent-tls

  rules:
  - host: dashboard.hermes.beutra.fr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hermes-agent
            port:
              number: 9119

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forwardauth-api
  namespace: hermes-agent
spec:
  forwardAuth:
    # nginx mode answers 401 where the traefik mode answers 302. The dashboard
    # polls /api from XHR, which cannot complete an interactive OAuth redirect:
    # the cross-origin hop to auth.beutra.fr dies on CORS and the SPA retries
    # forever, which is what flooded authentik with authorize requests.
    address: http://ak-outpost-homelab-outpost.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/nginx
    trustForwardHeader: true
    authResponseHeaders:
      - Set-Cookie
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-uid

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-agent-api-ingress
  namespace: hermes-agent
  annotations:
    # No cluster-issuer here: the certificate is owned by hermes-agent-ingress,
    # this router only reuses the secret it produces.
    traefik.ingress.kubernetes.io/router.middlewares: "hermes-agent-authentik-forwardauth-api@kubernetescrd"
spec:
  ingressClassName: traefik

  tls:
  - hosts:
    - dashboard.hermes.beutra.fr
    secretName: hermes-agent-tls

  rules:
  - host: dashboard.hermes.beutra.fr
    http:
      # PathPrefix(/api) outranks PathPrefix(/) on traefik rule length, so API
      # calls take this router and the 401 middleware instead of the 302 one.
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: hermes-agent
            port:
              number: 9119
