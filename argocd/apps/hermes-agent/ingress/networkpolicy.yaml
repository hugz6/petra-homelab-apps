# Default-deny ingress for the hermes-agent namespace, then allow only Traefik to
# reach the dashboard port. The agent gateway itself is outbound-only: the
# dashboard listener is the single legitimate inbound path.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: hermes-agent
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-hermes-agent
  namespace: hermes-agent
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 9119
