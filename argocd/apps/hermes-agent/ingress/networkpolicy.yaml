# Default-deny ingress for the hermes-agent namespace, then allow only Traefik to
# reach the dashboard port. The agent gateway itself is outbound-only: the
# dashboard listener is the single legitimate inbound path.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: hermes-agent
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-hermes-agent
  namespace: hermes-agent
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 9119
---
# cert-manager runs the HTTP-01 challenge in a solver pod of this namespace,
# which Traefik must reach on 8089. The default-deny above would otherwise time
# the challenge out and no certificate would ever be issued.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-acme-solver
  namespace: hermes-agent
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8089
