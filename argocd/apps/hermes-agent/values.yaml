config:
  # OpenRouter registered as a custom OpenAI-compatible provider rather than
  # the built-in `openrouter` key: only a custom provider accepts extra_headers,
  # and x-session-id is what pins sticky routing from the first request instead
  # of waiting for a cache hit to be observed.
  providers:
    openrouter-sticky:
      base_url: https://openrouter.ai/api/v1
      key_env: OPENROUTER_API_KEY
      discover_models: true
      extra_headers:
        x-session-id: "hermes-agent-homelab"
  model:
    provider: openrouter-sticky
    default: z-ai/glm-5.3-flash:floor   # :floor = cheapest endpoint among the providers the account privacy filter allows
  terminal:
    backend: local
  agent:
    gateway_timeout: 1800
  dashboard:
    # External origin the dashboard is reached at: drives login callbacks and is
    # the only accepted Host / WebSocket Origin behind Traefik.
    public_url: "https://dashboard.hermes.beutra.fr"
    # Only these peers may set X-Forwarded-Proto / X-Forwarded-For. Without the
    # cluster pod CIDR here, the TLS-terminating ingress is not trusted and
    # session cookies are not marked Secure.
    trusted_proxies:
      - "10.233.64.0/18"

env: {}
extraEnvFrom:
  - secretRef:
      name: hermes-agent-provider
  - secretRef:
      name: hermes-agent-telegram
  - secretRef:
      name: hermes-agent-dashboard

extraEnv:
  - name: TELEGRAM_HOME_CHANNEL
    value: "8336629237"
  - name: TELEGRAM_ALLOWED_USERS
    value: "8336629237"
  # Starts the dashboard s6 service, which stays down otherwise.
  - name: HERMES_DASHBOARD
    value: "1"

# ClusterIP for the dashboard listener; the gateway itself is outbound-only.
service:
  enabled: true
  type: ClusterIP
  port: 9119

persistence:
  enabled: true
  storageClass: longhorn
  size: 10Gi

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 2Gi
