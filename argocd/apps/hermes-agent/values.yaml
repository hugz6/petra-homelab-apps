config:
  model:
    provider: nvidia
    default: z-ai/glm-5.3-flash
  terminal:
    backend: local
  agent:
    gateway_timeout: 1800

env: {}
extraEnvFrom:
  - secretRef:
      name: hermes-agent-provider
  - secretRef:
      name: hermes-agent-telegram

extraEnv:
  - name: TELEGRAM_HOME_CHANNEL
    value: "8336629237"
  - name: TELEGRAM_ALLOWED_USERS
    value: "8336629237"

persistence:
  enabled: true
  storageClass: longhorn
  size: 10Gi

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 2Gi
