config:
  # OpenRouter registered as a custom OpenAI-compatible provider rather than
  # the built-in `openrouter` key: only a custom provider accepts extra_headers,
  # and x-session-id is what pins sticky routing from the first request instead
  # of waiting for a cache hit to be observed.
  providers:
    openrouter-sticky:
      base_url: https://openrouter.ai/api/v1
      key_env: OPENROUTER_API_KEY
      discover_models: true
      extra_headers:
        x-session-id: "hermes-agent-homelab"
  model:
    provider: openrouter-sticky
    default: z-ai/glm-5.3-flash:floor   # :floor = cheapest endpoint among the providers the account privacy filter allows
  terminal:
    backend: local
  agent:
    gateway_timeout: 1800
  dashboard:
    # External origin the dashboard is reached at: drives login callbacks and is
    # the only accepted Host / WebSocket Origin behind Traefik.
    public_url: "https://dashboard.hermes.beutra.fr"
    # Only these peers may set X-Forwarded-Proto / X-Forwarded-For. Without the
    # cluster pod CIDR here, the TLS-terminating ingress is not trusted and
    # session cookies are not marked Secure.
    trusted_proxies:
      - "10.233.64.0/18"

env: {}
extraEnvFrom:
  - secretRef:
      name: hermes-agent-provider
  - secretRef:
      name: hermes-agent-telegram
  - secretRef:
      name: hermes-agent-dashboard

extraEnv:
  - name: TELEGRAM_HOME_CHANNEL
    value: "8336629237"
  - name: TELEGRAM_ALLOWED_USERS
    value: "8336629237"
  # $HOME defaults to /root, which is unwritable once the root filesystem is
  # read-only: point it at the persistent volume.
  - name: HOME
    value: "/opt/data"
  # Starts the dashboard s6 service, which stays down otherwise.
  - name: HERMES_DASHBOARD
    value: "1"

# ClusterIP for the dashboard listener; the gateway itself is outbound-only.
service:
  enabled: true
  type: ClusterIP
  port: 9119

persistence:
  enabled: true
  storageClass: longhorn
  size: 10Gi

resources:
  requests:
    cpu: 200m
    memory: 512Mi
    # Caps the writable container layer: without it the agent can fill the
    # node disk (695G free on k8s-w-2) and evict every pod on it.
    ephemeral-storage: 1Gi
  limits:
    memory: 2Gi
    ephemeral-storage: 4Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10000
  runAsGroup: 10000
  # Longhorn honours fsGroup, which regrants access to the existing PVC
  # contents after the switch away from uid 0.
  fsGroup: 10000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Writable scratch for a read-only root filesystem.
extraVolumes:
  - name: run-tmpfs
    emptyDir:
      medium: Memory
      sizeLimit: 16Mi
  - name: tmp-tmpfs
    emptyDir:
      medium: Memory
      sizeLimit: 64Mi

extraVolumeMounts:
  - name: run-tmpfs
    mountPath: /run
  - name: tmp-tmpfs
    mountPath: /tmp

networkPolicy:
  enabled: true
  # Egress only. Ingress is covered by the namespace policies in ingress/:
  # policies are additive, so the empty ingress list here denies nothing that
  # allow-traefik-to-hermes-agent already permits.
  allowDns: true
  # No RFC1918 and no metadata endpoint: the agent has no business reaching
  # Longhorn, the CNPG clusters or the API server.
  blockPrivateEgress: true
  extraEgress:
    # kubespray resolves through nodelocaldns on a link-local address, which
    # blockPrivateEgress would otherwise drop along with the metadata range.
    - to:
        - ipBlock:
            cidr: 169.254.25.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
